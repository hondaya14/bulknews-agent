app {
  # Gemini API Configuration
  gemini {
    # API key can be set via GEMINI_API_KEY environment variable
    apiKey = "YOUR_GEMINI_API_KEY_HERE"
    apiKey = ${?GEMINI_API_KEY}
  }

  # News Topics Configuration
  news {
    topics = [
      "Artificial Intelligence and Machine Learning",
      "Cloud Computing and DevOps",
      "Cybersecurity",
      "Web Development",
      "Mobile Development"
    ]
  }

  # Output Configuration
  output {
    format = "markdown"
  }

  # Deployment Configuration
  deployment {
    # Options: local, s3, github
    target = "local"
    target = ${?DEPLOYMENT_TARGET}

    # S3 Configuration (required if target = "s3")
    s3 {
      bucket = "my-news-bucket"
      bucket = ${?S3_BUCKET}
      region = "us-east-1"
      region = ${?S3_REGION}
    }

    # GitHub Pages Configuration (required if target = "github")
    github {
      token = ""
      token = ${?GITHUB_TOKEN}
      repo = "username/repo"
      repo = ${?GITHUB_REPO}
      branch = "gh-pages"
      branch = ${?GITHUB_BRANCH}
    }
  }
}
